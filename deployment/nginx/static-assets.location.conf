# Add ONLY inside the existing gipc.org.ge HTTPS server block.
# Prefix + extension allowlist: no API, uploads, HTML, or private responses.
location ~ ^/(?:styles/.+\.css|scripts/.+\.js|assets/svg/.+\.svg|assets/fonts/.+\.(?:ttf|woff2))$ {
    root /var/www/gipc/frontend;
    try_files $uri =404;
    # The current server's mime.types does not yet declare TTF or WOFF2.
    # Define every extension in this location, preserving CSS/JS/SVG types.
    types {
        text/css css;
        application/javascript js;
        image/svg+xml svg;
        font/ttf ttf;
        font/woff2 woff2;
    }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript image/svg+xml font/ttf application/x-font-ttf;
    expires $gipc_static_expires;
}
