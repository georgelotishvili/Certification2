# HTTP context, before the existing GIPC server block.
# Only explicitly versioned public assets may remain fresh for one hour.
# Unversioned scripts/styles and HTML must revalidate, never be immutable.
map $arg_v $gipc_static_expires {
    default -1;
    ~^[A-Za-z0-9][A-Za-z0-9._-]*$ 1h;
}

server {
    server_name gipc.org.ge www.gipc.org.ge;

    # Add ONLY inside the existing gipc.org.ge HTTPS server block.
    # Prefix + extension allowlist: no API, uploads, HTML, or private responses.
    location ~ ^/(?:styles/.+\.css|scripts/.+\.js|assets/svg/.+\.svg|assets/fonts/.+\.(?:ttf|woff2))$ {
        root /var/www/gipc/frontend;
        try_files $uri =404;
        # The current server's mime.types does not yet declare TTF or WOFF2.
        # Define every extension in this location, preserving CSS/JS/SVG types.
        types {
            text/css css;
            application/javascript js;
            image/svg+xml svg;
            font/ttf ttf;
            font/woff2 woff2;
        }
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types text/css application/javascript text/javascript image/svg+xml font/ttf application/x-font-ttf;
        expires $gipc_static_expires;
    }

    location / {
        root /var/www/gipc/frontend;
        expires -1;
        index pages/index.html;
        try_files $uri $uri/ /pages/index.html;
    }

    location = /admin { alias /var/www/gipc/frontend/pages/admin.html; expires -1; }
    location = /admin.html { alias /var/www/gipc/frontend/pages/admin.html; expires -1; }
    location = /my { alias /var/www/gipc/frontend/pages/my.html; expires -1; }
    location = /my.html { alias /var/www/gipc/frontend/pages/my.html; expires -1; }
    location = /registrations { alias /var/www/gipc/frontend/pages/registrations.html; expires -1; }
    location = /registrations.html { alias /var/www/gipc/frontend/pages/registrations.html; expires -1; }

    location /auth {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /exam {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
