    }

    location /public {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 1G;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/gipc.org.ge/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gipc.org.ge/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.gipc.org.ge) { return 301 https://$host$request_uri; }
    if ($host = gipc.org.ge) { return 301 https://$host$request_uri; }
    listen 80;
    server_name gipc.org.ge www.gipc.org.ge;
    return 404;
}
