  <body class="registry-document">
    <!-- The same shared header used by the homepage and personal page. -->
    <main class="registry-page" id="registryPage">
      <section class="registry-controls" aria-labelledby="registryTitle">
        <div class="registry-toolbar-head">
          <div class="registry-title-group">
            <h1 id="registryTitle">სერტიფიცირებული პირების რეესტრი</h1>
            <span id="registryResultsCount" class="registry-count-badge" role="status" aria-live="polite" aria-atomic="true">—</span>
          </div>
          <button type="button" id="registryResetFilters" class="registry-reset" hidden>ფილტრების გასუფთავება</button>
        </div>

        <div class="registry-control-row">
          <div class="registry-search-field">
            <label class="registry-field-label" for="registrySearch">პირის ძიება</label>
            <input type="search" id="registrySearch" class="registry-search" placeholder="სახელი, გვარი ან სერტიფიცირების კოდი..." autocomplete="off" maxlength="300" />
          </div>
          <label class="registry-sort" for="registrySort">
            <span class="registry-field-label">დალაგება</span>
            <select id="registrySort">
              <option value="date_desc">უახლესი რეგისტრაციები</option>
              <option value="date_asc">ძველი რეგისტრაციები</option>
              <option value="name_asc">სახელი (ა-ჰ)</option>
              <option value="name_desc">სახელი (ჰ-ა)</option>
              <option value="rating_desc">რეიტინგი მაღალი → დაბალი</option>
              <option value="rating_asc">რეიტინგი დაბალი → მაღალი</option>
            </select>
          </label>
        </div>

        <fieldset class="registry-filter-fieldset">
          <legend class="registry-field-label">კვალიფიკაცია</legend>
          <div class="registry-checkboxes">
            <label class="registry-check" data-qual="architect">
              <input type="checkbox" id="registryFilterArchitect" />
              <span>არქიტექტორი</span>
            </label>
            <label class="registry-check" data-qual="expert">
              <input type="checkbox" id="registryFilterExpert" />
              <span>არქიტექტორი ექსპერტი</span>
            </label>
            <label class="registry-check" data-qual="municipal">
              <input type="checkbox" id="registryFilterMunicipal" />
              <span>მუნიციპალიტეტის სპეციალისტი</span>
            </label>
          </div>
        </fieldset>
      </section>

      <section class="registry-results" aria-label="რეესტრის ჩანაწერები">
        <noscript>
          <p class="registry-noscript">ჩანაწერების ჩასატვირთად და მოსაძებნად ჩართეთ JavaScript თქვენს ბრაუზერში. ინფორმაციისთვის დაგვიკავშირდით: <a href="mailto:info@gipc.ge">info@gipc.ge</a>.</p>
        </noscript>
        <div id="registryError" class="registry-refresh-error" role="alert" hidden></div>
        <div class="registry-list" id="registryList" role="list" aria-label="სერტიფიცირებული პირები" aria-busy="true"></div>
        <nav id="registryPagination" class="registry-pagination" hidden aria-label="რეესტრის გვერდები">
          <button id="registryPrevious" type="button">წინა</button>
          <span id="registryPageNumber" role="status" aria-live="polite"></span>
          <button id="registryNext" type="button">შემდეგი</button>
        </nav>
      </section>
    </main>

    <footer class="registry-footer">

        </div>
